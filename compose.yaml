services:
  postgres:
    image: postgres:17
    container_name: clientops-db
    environment:
      POSTGRES_USER: drishyaajith
      POSTGRES_PASSWORD: dockerpassword
      POSTGRES_DB: clientops
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U drishyaajith -d clientops"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: clientops-api
    ports:
      - "8000:8000"
    env_file:
      - .env.docker
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - chroma_data:/app/vector_db

volumes:
  postgres_data:
  chroma_data: